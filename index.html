<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#e9e9e9" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="light" />
  <title>Icon Matcher</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="Style.css" />
</head>

<body>
  <main class="app-shell">
    <section class="matcher-widget" aria-label="Icon Matcher">

      <header class="widget-controls">
        <div class="player-toggle" role="group" aria-label="Players">
          <button class="mode-btn active" id="one-player" type="button" aria-pressed="true">
            <span class="dot-text" data-text="1P">1P</span>
          </button>
          <button class="mode-btn" id="two-player" type="button" aria-pressed="false">
            <span class="dot-text" data-text="2P">2P</span>
          </button>
        </div>

        <label class="grid-control">
          <span class="sr-only">Grid size</span>
          <select id="grid-select" aria-label="Grid size">
            <option value="2x4">2×4</option>
            <option value="4x4" selected>4×4</option>
            <option value="4x5">4×5</option>
          </select>
          <span class="select-arrow" aria-hidden="true"></span>
        </label>

        <button id="reset-btn" class="reset-btn" type="button" aria-label="Reset game">
          <span class="reset-symbol" aria-hidden="true"></span>
        </button>
      </header>

      <section class="score-row" aria-label="Game score">
        <div class="player-score active" id="player-one-score">
          <span class="score-label dot-text" data-text="P1">P1</span>
          <strong class="score-value dot-text" id="p1-score" data-text="0">0</strong>
        </div>
        <div class="player-score" id="player-two-score">
          <span class="score-label dot-text" data-text="P2">P2</span>
          <strong class="score-value dot-text" id="p2-score" data-text="0">0</strong>
          <span class="status-dot" aria-hidden="true"></span>
        </div>
      </section>

      <section id="game-board" class="game-board" aria-label="Memory cards"></section>

      <section class="game-info" aria-live="polite">
        <div>
          <span class="info-label">MOVES</span>
          <strong id="move-count">0</strong>
        </div>
        <div>
          <span class="info-label">BEST</span>
          <strong id="best-score">-</strong>
        </div>
      </section>

      <div id="victory-overlay" class="victory-overlay" hidden>
        <div class="victory-card">
          <span class="victory-mark" aria-hidden="true"></span>
          <p class="victory-title">CLEAR</p>
          <p class="victory-result">
            <span id="victory-moves">0</span> MOVES
          </p>
          <p class="victory-best">
            BEST <span id="victory-best-score">-</span>
          </p>
          <button id="play-again-btn" class="play-again-btn" type="button">PLAY AGAIN</button>
        </div>
      </div>
    </section>

    <div id="ad-container" class="ad-container" aria-hidden="true"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
